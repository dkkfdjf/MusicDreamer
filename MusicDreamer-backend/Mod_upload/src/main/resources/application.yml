server:
  port: 8007

spring:
  application:
    name: uploadService8007
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/music?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:hce200572}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  task:
    scheduling:
      pool:
        size: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

upload:
  # 本地开发默认指向项目内 data 目录；原作者机器为 D:/Desktop/MusicDreamer/backend/data，
  # 拉到本地后这里会被覆盖（STORAGE_ROOT 环境变量优先）。如设置服务里另行存了 storage_root，
  # 需要保证两端一致，否则 Mod_media 写入与 Mod_upload 读取会落到不同目录，B 站导入必 404。
  storage-root: ${STORAGE_ROOT:C:/Users/34392/Desktop/项目3/MusicDreamer-backend/data}

