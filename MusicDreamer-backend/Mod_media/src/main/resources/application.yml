server:
  port: 8010

spring:
  application:
    name: mediaService8010
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/music?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:hce200572}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        enabled: ${NACOS_ENABLED:true}
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
  task:
    scheduling:
      pool:
        size: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

media:
  # 本地开发默认指向项目内 data 目录；原作者机器为 D:/Desktop/MusicDreamer/backend/data。
  # 注意：Mod_media 实际生效值还会被设置服务里的 storage_root 覆盖（60s 缓存），
  # 若 setting 表里存了别的值，会与 Mod_upload 不一致，导致 B 站导入歌曲播放 404。
  storage-root: ${STORAGE_ROOT:C:/Users/34392/Desktop/项目3/MusicDreamer-backend/data}
  tools-path: ${TOOLS_PATH:}
  volume-target-lufs: -16
  download-concurrency: 1
  transcribe-concurrency: 2
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 30000
  sentinel:
    transport:
      dashboard: ${SENTINEL_DASH:localhost:8858}
      port: 8719

